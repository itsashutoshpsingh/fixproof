# Host recipes: which steps build each state. Ubuntu steps are scripts in lab/ubuntu/files;
# for the official-image distros, "overlay" writes the newer image's files over the running
# host by rename, the way dpkg, rpm and apk replace files during an upgrade.
# reboot = container restart: every process, PID 1 included, starts again from the files on disk.
# targets: which CVEs a host is scored for (all = every non-kernel case for the distro).
ubuntu_states:
  S0: {steps: [start-services], targets: all}
  S2: {steps: [upgrade, reboot, start-services], targets: all}
  S3: {steps: [start-services, collect-before, upgrade], targets: all}
  S5: {steps: [mitigate, start-services], targets: mitigated}
  S6: {steps: [upgrade, install-old-kernel, reboot, start-services], targets: kernel}
  S7: {steps: [remove], targets: [openssh-server, sudo]}
  S8: {steps: [start-services, collect-before, remove], targets: [openssh-server, sudo]}
  S9: {steps: [collect-before, legacy-copy, upgrade, reboot, start-services, start-legacy], targets: tls}
official_states:
  S0: {image: old, steps: [start-procs], targets: all}
  SU: {image: new, steps: [start-procs], targets: all}      # labelled S1 or S2 per CVE fix_type
  S3: {image: old, steps: [start-procs, collect-before, overlay], targets: all}
skip:
  - ubuntu-24.04/S6   # CVE-2024-1086 does not affect the noble kernel
