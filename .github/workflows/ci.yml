name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
      - run: uv sync --locked --all-extras
      - run: uv run ruff check src tests lab
      - run: uv run pytest -q
      # Re-score the committed raw evidence and scanner output; the published tables must follow from it.
      - run: uv run fixproof score && uv run fixproof report && git diff --exit-code results/cells.csv results/restart.csv results/tables.md results/summary.json results/headline_numbers.json
